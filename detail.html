<body>

  <!-- Navbar -->

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Beranda</a>

               href="login.html">Login</a>

    </div>

  <!-- Judul detail -->
  <section class="py-5">
    <div class="container">
      <a href="wisata.html" class="text-success text-decoration-none">
        ← Kembali ke Daftar Wisata
      </a>

      <div class="mt-4">
        <p class="section-label" id="lokasi"></p>
        <h1 class="fw-bold display-5" id="judul"></h1>
        <p class="text-secondary" id="subjudul"></p>
      </div>
    </div>
  </section>

  <!-- Foto utama -->
  <section class="pb-4">
    <div class="container">
      <img id="gambar" src="" alt=""
           class="img-fluid w-100 rounded-4"
           style="height:420px; object-fit:cover;">
    </div>
  </section>

  <!-- Informasi wisata -->
  <section class="py-4 pb-5">
    <div class="container">
      <div class="row g-4">

        <div class="col-lg-8">
          <h2 class="fw-bold mb-3">Tentang Destinasi</h2>

          <p class="text-secondary" style="line-height:1.9"
             id="deskripsi1"></p>

          <p class="text-secondary" style="line-height:1.9"
             id="deskripsi2"></p>

          <h3 class="fw-bold mt-4 mb-3">Daya Tarik Wisata</h3>
          <div class="row g-3" id="dayaTarik"></div>
        </div>

        <div class="col-lg-4">
          <div class="p-4 rounded-4 border shadow-sm">
            <h4 class="fw-bold mb-3">Tips Berkunjung</h4>
            <ul class="text-secondary ps-3" id="tips"></ul>

            <a href="wisata.html"
               class="btn btn-success rounded-pill w-100 mt-3">
              Jelajahi Wisata Lain
            </a>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer-custom py-4">
    <div class="container text-center">
      <p class="fw-bold mb-1">Jelajah Indonesia</p>
      <p class="small mb-0">
        © 2026 Jelajah Indonesia | Proyek UTS
      </p>
    </div>
  </footer>

  <script>
    const destinasi = {
      bali: {
        lokasi: "BALI, INDONESIA",
        judul: "Pesona Pulau Dewata",
        subjudul: "Keindahan pantai, alam, budaya, dan tradisi Bali.",
        gambar: "https://images.unsplash.com/photo-1537996194471-e657df975ab4?auto=format&fit=crop&w=1600&q=85",
        alt: "Pemandangan wisata Bali",
        deskripsi1: "Bali merupakan salah satu tujuan wisata terkenal di Indonesia. Pulau ini menawarkan pantai, pemandangan alam, seni, kuliner, serta tradisi budaya yang menarik wisatawan.",
        deskripsi2: "Pengunjung dapat menikmati suasana pantai, menjelajahi kawasan pedesaan, mengunjungi tempat budaya, dan mencoba beragam kuliner khas Bali.",
        daya: [
          ["🏖️ Pantai", "Menikmati panorama pantai dan matahari terbenam."],
          ["🌿 Alam", "Melihat sawah, perbukitan, dan lanskap tropis."],
          ["🏛️ Budaya", "Mengenal seni, tradisi, dan arsitektur lokal."],
          ["🍽️ Kuliner", "Mencoba aneka makanan khas Bali."]
        ],
        tips: ["Pilih waktu kunjungan yang sesuai.", "Gunakan pakaian nyaman.", "Hormati adat dan aturan setempat.", "Jaga kebersihan lingkungan."]
      },

      borobudur: {
        lokasi: "JAWA TENGAH, INDONESIA",
        judul: "Candi Borobudur",
        subjudul: "Warisan sejarah dengan arsitektur Buddha yang mengagumkan.",
        gambar: "https://images.unsplash.com/photo-1596402184320-417e7178b2cd?auto=format&fit=crop&w=1600&q=85",
        alt: "Candi Borobudur di Jawa Tengah",
        deskripsi1: "Candi Borobudur merupakan bangunan bersejarah yang terkenal dengan susunan batu, relief, dan stupa yang memiliki nilai budaya tinggi.",
        deskripsi2: "Wisatawan dapat menikmati arsitektur candi, mempelajari sejarahnya, dan melihat pemandangan alam di kawasan sekitarnya.",
        daya: [
          ["🏛️ Arsitektur", "Melihat susunan candi dan stupa bersejarah."],
          ["📜 Sejarah", "Mengenal kisah dan relief pada dinding candi."],
          ["🌄 Pemandangan", "Menikmati lanskap alam sekitar candi."],
          ["📷 Fotografi", "Mengabadikan keindahan bangunan bersejarah."]
        ],
        tips: ["Periksa jam kunjungan sebelum berangkat.", "Gunakan alas kaki nyaman.", "Patuhi aturan kawasan candi.", "Jaga kebersihan dan kelestarian situs."]
      },

      "raja-ampat": {
        lokasi: "PAPUA BARAT DAYA, INDONESIA",
        judul: "Keindahan Raja Ampat",
        subjudul: "Gugusan pulau dan perairan jernih yang memukau.",
        gambar: "https://images.unsplash.com/photo-1516690561799-46d8f74f9abf?auto=format&fit=crop&w=1600&q=85",
        alt: "Pemandangan pulau dan laut tropis",
        deskripsi1: "Raja Ampat dikenal dengan gugusan pulau, perairan jernih, dan kekayaan kehidupan lautnya.",
        deskripsi2: "Pengunjung dapat menikmati pemandangan pulau, snorkeling atau menyelam di lokasi yang diizinkan, serta mengenal budaya masyarakat setempat.",
        daya: [
          ["🌊 Laut", "Menikmati perairan biru dan pantai yang indah."],
          ["🐠 Biota Laut", "Mengenal kekayaan kehidupan bawah laut."],
          ["🏝️ Pulau", "Menjelajahi gugusan pulau yang menawan."],
          ["🤿 Snorkeling", "Menikmati bawah laut dengan tetap menjaga alam."]
        ],
        tips: ["Rencanakan transportasi antarpulau.", "Gunakan pelampung saat diperlukan.", "Jangan merusak terumbu karang.", "Hormati masyarakat setempat."]
      },

      bromo: {
        lokasi: "JAWA TIMUR, INDONESIA",
        judul: "Gunung Bromo",
        subjudul: "Panorama pegunungan dan matahari terbit yang terkenal.",
        gambar: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1600&q=85",
        alt: "Pemandangan pegunungan Gunung Bromo",
        deskripsi1: "Gunung Bromo merupakan destinasi pegunungan yang terkenal dengan pemandangan lautan pasir, kawah, dan panorama matahari terbit.",
        deskripsi2: "Wisatawan dapat menikmati lanskap dari titik pandang yang tersedia dan menjelajahi kawasan sesuai ketentuan pengelola taman nasional.",
        daya: [
          ["🌄 Matahari Terbit", "Menikmati panorama pagi dari titik pandang."],
          ["🌋 Kawah", "Melihat kawasan vulkanik dari area yang diizinkan."],
          ["🏜️ Lautan Pasir", "Menyaksikan bentang alam yang unik."],
          ["📷 Fotografi", "Mengabadikan pemandangan pegunungan."]
        ],
        tips: ["Bawa jaket hangat.", "Gunakan alas kaki yang sesuai.", "Periksa cuaca dan status aktivitas gunung.", "Patuhi arahan petugas."]
      },

      "danau-toba": {
        lokasi: "SUMATERA UTARA, INDONESIA",
        judul: "Danau Toba",
        subjudul: "Danau luas dengan panorama alam dan budaya Batak.",
        gambar: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=85",
        alt: "Pemandangan danau dan perbukitan",
        deskripsi1: "Danau Toba merupakan destinasi alam di Sumatera Utara yang terkenal dengan danau luas dan pemandangan perbukitan.",
        deskripsi2: "Wisatawan dapat menikmati panorama danau, mengunjungi Pulau Samosir, serta mengenal budaya dan kuliner masyarakat Batak.",
        daya: [
          ["🌊 Danau", "Menikmati pemandangan danau yang luas."],
          ["⛰️ Perbukitan", "Melihat lanskap hijau di sekitar danau."],
          ["🏡 Budaya Batak", "Mengenal rumah adat dan tradisi setempat."],
          ["🍽️ Kuliner", "Mencicipi makanan khas daerah."]
        ],
        tips: ["Rencanakan perjalanan dan transportasi.", "Bawa pakaian sesuai cuaca.", "Hormati adat setempat.", "Jaga kebersihan kawasan danau."]
      },

      "labuan-bajo": {
        lokasi: "NUSA TENGGARA TIMUR, INDONESIA",
        judul: "Labuan Bajo",
        subjudul: "Gerbang menuju pulau-pulau eksotis dan petualangan laut.",
        gambar: "https://images.unsplash.com/photo-1510414842594-a61c9b5b1c90?auto=format&fit=crop&w=1600&q=85",
        alt: "Pemandangan laut dan pantai tropis",
        deskripsi1: "Labuan Bajo merupakan kota di Nusa Tenggara Timur yang menjadi pintu masuk untuk menjelajahi pulau dan perairan di kawasan Taman Nasional Komodo.",
        deskripsi2: "Pengunjung dapat menikmati panorama laut, mengikuti perjalanan kapal dengan operator yang sesuai, dan menjelajahi destinasi alam di sekitarnya.",
        daya: [
          ["⛵ Wisata Kapal", "Menikmati perjalanan laut bersama operator resmi."],
          ["🏝️ Pulau", "Melihat gugusan pulau dan pantai."],
          ["🌅 Panorama", "Menikmati pemandangan laut dan matahari terbenam."],
          ["🐉 Komodo", "Mengikuti kunjungan satwa dengan pemandu resmi."]
        ],
        tips: ["Pesan perjalanan dari operator tepercaya.", "Ikuti arahan pemandu.", "Gunakan perlindungan matahari.", "Jangan memberi makan atau mendekati satwa liar."]
      }
    };

    const parameter = new URLSearchParams(window.location.search);
    const pilihan = parameter.get("wisata") || "bali";
    const data = destinasi[pilihan] || destinasi.bali;

    document.title = data.judul + " | Jelajah Indonesia";
    document.getElementById("lokasi").textContent = data.lokasi;
    document.getElementById("judul").textContent = data.judul;
    document.getElementById("subjudul").textContent = data.subjudul;

    const gambar = document.getElementById("gambar");
    gambar.src = data.gambar;
    gambar.alt = data.alt;
    gambar.onerror = function () {
      this.alt = "Gambar tidak dapat dimuat. Periksa koneksi internet.";
    };

    document.getElementById("deskripsi1").textContent = data.deskripsi1;
    document.getElementById("deskripsi2").textContent = data.deskripsi2;

    const dayaTarik = document.getElementById("dayaTarik");
    data.daya.forEach(function (item) {
      const kolom = document.createElement("div");
      kolom.className = "col-sm-6";

      const kotak = document.createElement("div");
      kotak.className = "p-3 rounded-3 bg-light h-100";

      const judul = document.createElement("h5");
      judul.textContent = item[0];

      const deskripsi = document.createElement("p");
      deskripsi.className = "text-secondary mb-0";
      deskripsi.textContent = item[1];

      kotak.append(judul, deskripsi);
      kolom.appendChild(kotak);
      dayaTarik.appendChild(kolom);
    });

    const daftarTips = document.getElementById("tips");
    data.tips.forEach(function (tip) {
      const item = document.createElement("li");
      item.className = "mb-2";
      item.textContent = tip;
      daftarTips.appendChild(item);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
