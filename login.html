
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Jelajah Indonesia</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        Jelajah<span>Indonesia.</span>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="wisata.html">Destinasi</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="tentang.html">Tentang</a>
          </li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-warning rounded-pill px-4"
               href="login.html">Login</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form Login -->
  <section class="py-5 bg-light">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4 p-md-5">

              <div class="text-center mb-4">
                <h1 class="fw-bold">Selamat Datang!</h1>
                <p class="text-secondary">
                  Masuk ke Jelajah Indonesia
                </p>
              </div>

              <!-- Pesan validasi -->
              <div id="pesan" class="alert d-none"
                   role="alert" aria-live="polite"></div>

              <form id="formLogin" novalidate>

                <div class="mb-3">
                  <label for="email" class="form-label">
                    Email
                  </label>
                  <input type="email" class="form-control"
                         id="email" placeholder="nama@email.com"
                         autocomplete="email" required>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">
                    Password
                  </label>
                  <input type="password" class="form-control"
                         id="password" placeholder="Minimal 8 karakter"
                         autocomplete="current-password"
                         minlength="8" required>
                </div>

                <button type="submit"
                        class="btn btn-success w-100 rounded-pill py-2">
                  Login
                </button>

              </form>

              <p class="text-secondary small text-center mt-4 mb-0">
                Jelajah keindahan Indonesia bersama kami.
              </p>

              <div class="text-center mt-3">
                <a href="index.html"
                   class="text-success text-decoration-none">
                  ← Kembali ke Beranda
                </a>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer-custom py-4">
    <div class="container text-center">
      <p class="fw-bold mb-1">Jelajah Indonesia</p>
      <p class="small mb-0">
        © 2026 Jelajah Indonesia | Proyek UTS
      </p>
    </div>
  </footer>

  <script>
    const form = document.getElementById("formLogin");
    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const pesan = document.getElementById("pesan");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      pesan.classList.remove(
        "d-none", "alert-success", "alert-danger"
      );

      const emailValue = email.value.trim();
      const passwordValue = password.value;

      if (emailValue === "" || passwordValue.trim() === "") {
        tampilkanPesan("Email dan password wajib diisi.", false);
        return;
      }

      const polaEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!polaEmail.test(emailValue)) {
        tampilkanPesan("Format email tidak valid.", false);
        return;
      }

      if (passwordValue.length < 8) {
        tampilkanPesan(
          "Password harus memiliki minimal 8 karakter.", false
        );
        return;
      }

      tampilkanPesan(
        "Validasi berhasil! Formulir sudah memenuhi ketentuan.", true
      );
    });

    function tampilkanPesan(teks, berhasil) {
      pesan.textContent = teks;
      pesan.classList.remove(
        "d-none", "alert-success", "alert-danger"
      );
      pesan.classList.add(
        berhasil ? "alert-success" : "alert-danger"
      );
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
